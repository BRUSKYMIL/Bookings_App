
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro de Reserva</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body class="bg-gradient">
  <div class="container auth-container d-flex justify-content-center align-items-center vh-100">
    <div class="card auth-card shadow-lg">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">📝 Registro de Reserva</h2>
        <form th:action="@{/registro}" method="post">
          <input type="hidden" th:name="sessionId" th:value="${sessionId}">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="name" name="name" placeholder="Nombre" required>
            <label for="name">Nombre</label>
          </div>
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="surname" name="surname" placeholder="Apellido" required>
            <label for="surname">Apellido</label>
          </div>
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="Correo electrónico" required>
            <label for="email">Correo electrónico</label>
          </div>
          <div class="form-floating mb-4">
            <input type="number" class="form-control" id="seats" name="seats" min="1" value="1" placeholder="Plazas" required>
            <label for="seats">Número de plazas</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Reservar Ahora</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
