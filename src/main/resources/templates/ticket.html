<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirmación de Reserva</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/ticket.css}">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="ticket card shadow-lg p-4">
    <h2 class="text-center mb-4">🎟️ Confirmación de Reserva</h2>
    <p><strong>Nombre:</strong> <span th:text="${usuario != null ? usuario.name : ''}"></span></p>
    <p><strong>Email:</strong> <span th:text="${usuario != null ? usuario.email : ''}"></span></p>
    <p><strong>Nº de reserva:</strong> <span th:text="${booking != null ? booking.bookingCode : ''}"></span></p>
    <p class="mt-4">Tu plaza ha sido reservada correctamente. Presenta este comprobante el día de la sesión.</p>
    <div class="text-center mt-4 no-print">
      <button class="btn btn-outline-primary" onclick="window.print()">🖨️ Imprimir Ticket</button>
    </div>
  </div>
</body>
</html>
