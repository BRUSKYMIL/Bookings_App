
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sesiones disponibles</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/resultado.css}">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">📅 Sesiones para <span th:text="${fecha}"></span></h2>

    <div th:if="${sesiones.empty}" class="alert alert-warning text-center">
      No hay sesiones disponibles para esa fecha.
    </div>

    <div class="session-list">
      <div th:each="s : ${sesiones}" class="card session-card">
        <div class="card-body">
          <h5 class="card-title" th:text="${s.name}">Nombre</h5>
          <p class="card-text mb-1">👨‍🏫 Profesor: <span th:text="${s.teacher}"></span></p>
          <p class="card-text mb-1">🕒 Horario: <span th:text="${s.startTime}"></span> - <span th:text="${s.endTime}"></span></p>
          <p class="card-text">💺 Plazas disponibles: <span th:text="${s.spots}"></span></p>
          <form th:action="@{/registro}" method="get">
            <input type="hidden" th:name="sessionId" th:value="${s.id}" />
            <button type="submit" class="btn btn-outline-primary w-100 mt-2">Reservar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
