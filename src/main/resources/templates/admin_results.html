<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resultados de búsqueda</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <h2>Resultados de búsqueda</h2>
    <div th:if="${bookings != null and !bookings.empty}">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingCode}"></td>
                    <td th:text="${b.user.name}"></td>
                    <td th:text="${b.user.surname}"></td>
                    <td th:text="${b.user.email}"></td>
                    <td>
                        <form th:action="@{/admin/deleteBooking}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${b.id}" />
                            <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Seguro que quieres cancelar esta reserva?');">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${bookings == null or bookings.empty}">
        <p>No se encontraron reservas.</p>
    </div>
</body>
</html>
