<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Panel de administración</title>
  <style>
    body { font-family: Arial; padding: 2em; background-color: #f0f0f0; }
    .search-box { background: white; padding: 2em; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px #ccc; }
    .search-section { margin-bottom: 2em; }
    input, button { margin-top: 1em; width: 100%; padding: 0.5em; }
    .separator { text-align: center; margin: 1.5em 0; font-weight: bold; color: #888; }
  </style>
</head>
<body>
  <div class="search-box">
    <h2 style="text-align:center;">Buscar reservas</h2>
    <form th:action="@{/admin/search}" method="post">
      <div class="search-section">
        <h4>Búsqueda por nombre y apellido</h4>
        <input type="text" name="name" placeholder="Nombre" />
        <input type="text" name="surname" placeholder="Apellido" />
        <button type="submit">Buscar por nombre y apellido</button>
      </div>
      <div class="separator">o</div>
      <div class="search-section">
        <h4>Búsqueda por número de reserva</h4>
        <input type="number" name="bookingNumber" placeholder="Nº Reserva" />
        <button type="submit">Buscar por Nº Reserva</button>
      </div>
    </form>
  </div>
</body>
</html>
